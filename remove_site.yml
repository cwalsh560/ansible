---

- hosts: all
  become: true
  tasks:

  - name: install updates Ubuntu
    apt:
      update_cache: yes
      upgrade: dist
    when : ansible_facts["distribution"] == 'Ubuntu'
  
  - name: install updates Debian
    apt:
      update_cache: yes
      upgrade: dist
    when : ansible_facts["distribution"] == 'Debian'

  
- hosts: web_server
  become: true
  tasks:

  - name: remove apache & php
    apt:
      name:
      - apache2
      - libapache2-mod-php
      state: absent

- hosts: db_server
  become: true
  tasks:

  - name: remove mariadb
    apt:
      name:
      - mariadb-server
      state: absent

- hosts: file_server
  become: true
  tasks:
  
  - name: remove samba
    apt:
      name:
      - samba
      state: absent

 